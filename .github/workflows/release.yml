name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: git-recap
            asset_name: git-recap-linux-amd64
          - os: macos-latest
            artifact_name: git-recap
            asset_name: git-recap-macos-amd64
          - os: windows-latest
            artifact_name: git-recap.exe
            asset_name: git-recap-windows-amd64.exe

    steps:
    - uses: actions/checkout@v4
    - name: Build Release
      run: cargo build --release
    
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: target/release/${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}
        overwrite: true
